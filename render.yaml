services:
  - type: web
    name: hotel-erp-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://hotel-erp-nine.vercel.app
      - key: WEBSITE_URL
        value: https://hotel-website-pi-five.vercel.app
      - key: CORS_ORIGIN
        value: '*'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
